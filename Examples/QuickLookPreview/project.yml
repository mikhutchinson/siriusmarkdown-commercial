name: SiriusMarkdownQuickLookExample
options:
  deploymentTarget:
    macOS: '13.0'
packages:
  SiriusMarkdown:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  SiriusMarkdownPreview:
    type: application
    platform: macOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: SiriusMarkdown Preview
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: text/markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftpython.SiriusMarkdownPreview
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: MarkdownPreviewExtension
        embed: true
      - sdk: Quartz.framework
  MarkdownPreviewExtension:
    type: app-extension
    platform: macOS
    sources: [Extension]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: SiriusMarkdown
        NSExtension:
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown, public.markdown]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: Extension/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftpython.SiriusMarkdownPreview.PreviewExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
    dependencies:
      - package: SiriusMarkdown
        product: SiriusMarkdownQuickLook
      - sdk: Quartz.framework
  CompetitionFixture:
    type: application
    platform: macOS
    sources: [CompetitionFixture/Host]
    info:
      path: CompetitionFixture/Host/Info.plist
      properties:
        CFBundleDisplayName: Markdown Competition Fixture
        NSPrincipalClass: NSApplication
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: text/markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftpython.SiriusMarkdownCompetitionFixture
    dependencies:
      - target: CompetitionPreviewExtension
        embed: true
  CompetitionPreviewExtension:
    type: app-extension
    platform: macOS
    sources: [CompetitionFixture/Extension]
    info:
      path: CompetitionFixture/Extension/Info.plist
      properties:
        CFBundleDisplayName: Markdown Competition Fixture
        NSExtension:
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown, public.markdown]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: CompetitionFixture/Extension/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftpython.SiriusMarkdownCompetitionFixture.PreviewExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
    dependencies:
      - sdk: Quartz.framework
schemes:
  SiriusMarkdownPreview:
    build:
      targets:
        SiriusMarkdownPreview: all
  CompetitionFixture:
    build:
      targets:
        CompetitionFixture: all
